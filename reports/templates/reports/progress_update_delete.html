{% extends "reports/base.html" %}

{% block content %}

<section class="form-section">
    <h1>Delete Progress Update</h1>

    <p>
        Are you sure you want to delete this progress update?
    </p>

    <p>
        <strong>{{ update.notes }}</strong>
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit" class="delete-button">
            Delete Update
        </button>

        <a
            href="{% url 'report_detail' update.tree_report.pk %}"
            class="primary-button"
        >
            Cancel
        </a>
    </form>
</section>

{% endblock %}
